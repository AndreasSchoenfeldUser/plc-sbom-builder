# {version} ist die Firmware ohne führendes "V". Die CPE unten ist ein Beispiel.
- vendor: Siemens AG
  orderNumber: "6ES7 214-1AG4?-0XB0"
  cpe: "cpe:2.3:o:siemens:simatic_s7-1200_cpu_firmware:{version}:*:*:*:*:*:*:*"
