name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PlcSbom.sln

      - name: Format
        run: dotnet format PlcSbom.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PlcSbom.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --solution PlcSbom.sln -c Release --no-build

      - name: Licenses
        if: runner.os == 'Linux'
        run: dotnet run tools/check-licenses.cs -- --verify

      - name: Publish
        run: |
          dotnet publish src/PlcSbom.Cli/PlcSbom.Cli.csproj -c Release -r ${{ matrix.rid }} \
            -p:ContinuousIntegrationBuild=true -o out/publish
          version=$(dotnet msbuild src/PlcSbom.Cli/PlcSbom.Cli.csproj -getProperty:Version)
          echo "PACKAGE=plc-sbom-${version}-${{ matrix.rid }}" >> "$GITHUB_ENV"

      # M13: every package carries the SBOM of the tool itself (CLAUDE.md section 11, E-025).
      - name: Tool SBOM
        run: |
          exe=out/publish/plc-sbom
          if [ "$RUNNER_OS" = "Windows" ]; then exe=out/publish/plc-sbom.exe; fi
          mkdir -p out/pkg
          dotnet run tools/tool-sbom.cs -- --exe "$exe" --out out/pkg/plc-sbom.cdx.json

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out/pkg dist
          cp out/publish/plc-sbom THIRD-PARTY-NOTICES.md out/pkg/
          tar -czf "dist/${PACKAGE}.tar.gz" -C out/pkg .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/pkg, dist | Out-Null
          Copy-Item out/publish/plc-sbom.exe, THIRD-PARTY-NOTICES.md out/pkg/
          Compress-Archive -Path out/pkg/* -DestinationPath "dist/$env:PACKAGE.zip"

      # M0 is done when --help runs from the package on both platforms (CLAUDE.md section 12).
      - name: Smoke test from package
        run: |
          smoke=out/smoke
          mkdir -p "$smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path 'dist/$PACKAGE.zip' -DestinationPath '$smoke'"
            exe="$smoke/plc-sbom.exe"
          else
            tar -xzf "dist/$PACKAGE.tar.gz" -C "$smoke"
            exe="$smoke/plc-sbom"
          fi
          test -f "$smoke/THIRD-PARTY-NOTICES.md"
          "$exe" --help
          "$exe" --version
          expect() { want=$1; shift; set +e; "$exe" "$@"; got=$?; set -e; [ "$got" = "$want" ] || { echo "exit $got, erwartet $want: $*"; exit 1; }; }
          # M13: the SBOM of the package names the exe with its SHA-512 and passes the release gate.
          test -f "$smoke/plc-sbom.cdx.json"
          grep -q "\"$(sha512sum "$exe" | cut -d' ' -f1)\"" "$smoke/plc-sbom.cdx.json"
          cp "$smoke/plc-sbom.cdx.json" out/tool-sbom.cdx.json
          expect 0 validate out/tool-sbom.cdx.json --release-build
          expect 2 unbekannt
          expect 2 build --config machine.yml --release R1
          if [ "$RUNNER_OS" = "Windows" ]; then
            expect 2 export-aml --project a.zap21 --out a.aml
          else
            expect 3 export-aml --project a.zap21 --out a.aml
          fi
          # M9: the package builds the sample machine; two runs give the same bytes (H3).
          export SOURCE_DATE_EPOCH=1792234800
          for run in a b; do
            expect 0 build --config samples/maschine-xy/machine.yml --release R2026.10 \
              --commit a1b2c3d4e5f60718293a4b5c6d7e8f9012345678 --out "out/m9/$run/sbom-maschine.cdx.json" --report none
          done
          cmp out/m9/a/sbom-maschine.cdx.json out/m9/b/sbom-maschine.cdx.json
          # M10 to M12: report from build, compare with the field file (deviations: exit 1), ids.
          expect 0 build --config samples/maschine-xy/machine.yml --release R2026.10 \
            --commit a1b2c3d4e5f60718293a4b5c6d7e8f9012345678 --out out/m10/sbom-maschine.cdx.json
          test -s out/m10/sbom-maschine.html
          expect 1 compare out/m10/sbom-maschine.cdx.json --field samples/maschine-xy/feld/1042.json \
            --as-built out/m10/sbom-1042.cdx.json --csv out/m10/abgleich-1042.csv
          test -s out/m10/sbom-maschine.compare-1042.result.json
          expect 0 validate out/m10/sbom-1042.cdx.json
          expect 0 report out/m10/sbom-1042.cdx.json --format md --out out/m10/bericht-1042.md --field samples/maschine-xy/feld/1042.json
          expect 0 ids out/m10/sbom-maschine.cdx.json --csaf fixtures/csaf --cpe-map samples/maschine-xy/kennungen/cpe-map.yml --out out/m10/ids.json
          unset SOURCE_DATE_EPOCH

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*
          if-no-files-found: error

  # Cross-check of the own TR-03183-2 validator against sbomqs over all golden files
  # (CLAUDE.md section 9, docs/entscheidungen.md E-010). A difference fails the job.
  crosscheck:
    needs: build
    runs-on: ubuntu-latest
    env:
      SBOMQS_VERSION: "2.1.3"
      SBOMQS_SHA256: c96f07a6a27314c1c268af141af04f1c1b49e61400d7058f6419ca4f7f3bdd6b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install sbomqs
        run: |
          file="sbomqs_${SBOMQS_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/interlynk-io/sbomqs/releases/download/v${SBOMQS_VERSION}/$file"
          echo "${SBOMQS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sbomqs"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/sbomqs"

      # The SBOM of the Linux package is checked along with the golden files.
      - uses: actions/download-artifact@v7
        with:
          pattern: plc-sbom-*-linux-x64
          path: out/artifact
          merge-multiple: true

      - name: Cross-check with sbomqs
        run: |
          mkdir -p out/pkg
          tar -xzf out/artifact/plc-sbom-*-linux-x64.tar.gz -C out/pkg ./plc-sbom.cdx.json
          dotnet run tools/crosscheck-sbomqs.cs -- --sbomqs "$RUNNER_TEMP/sbomqs/sbomqs" --markdown "$GITHUB_STEP_SUMMARY" \
            tests/PlcSbom.Tests/golden/*.cdx.json out/pkg/plc-sbom.cdx.json

  # Release packages on a tag v<version> (CLAUDE.md section 11): both packages and SHA256SUMS as one
  # workflow artifact. Publishing them (GitHub release, download page) stays a manual step.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, crosscheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zur Version ${version} in Directory.Build.props"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          pattern: plc-sbom-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          test -f "plc-sbom-${VERSION}-linux-x64.tar.gz"
          test -f "plc-sbom-${VERSION}-win-x64.zip"
          sha256sum plc-sbom-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: plc-sbom-${{ env.VERSION }}-release
          path: dist/*
          if-no-files-found: error
